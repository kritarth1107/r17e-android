name: Android debug build

on:
  push:
    branches: ["**"]
    tags: ["v*-debug"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform 36.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Decode shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/r17e-debug.keystore"
            echo "R17E_DEBUG_KEYSTORE=$RUNNER_TEMP/r17e-debug.keystore" >> "$GITHUB_ENV"
          else
            echo "No keystore secret (e.g. fork PR); using default debug key."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: r17e-android-debug-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-debug')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: r17e-android-debug-${{ steps.sha.outputs.short }}

      - name: Rename APK
        run: mv app-debug.apk "r17e-android-${GITHUB_REF_NAME}-debug.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} (debug build)
          prerelease: true
          body: |
            This is a **debug, non-production build** of r17e-android (${{ github.ref_name }}, commit ${{ steps.sha.outputs.short }}).
            It is signed with the shared debug key and is meant for testing only. Do not distribute it as a release.
          files: r17e-android-${{ github.ref_name }}-debug.apk
